<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#11111b" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="WhatsApp Lite" />
    <title>WhatsApp Lite</title>
    <script>
      // Aplica o tema antes da primeira pintura, sem piscar (a lógica completa está em api/theme.ts).
      try {
        var mode = localStorage.getItem('wpp.themeMode') || 'dark'
        if (mode === 'system') mode = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = (localStorage.getItem('wpp.theme') || 'catppuccin') + '-' + mode
        document.querySelector('meta[name="color-scheme"]').content = mode
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="splash" class="splash" role="status">
      <svg class="splash__icon" viewBox="0 0 512 512" width="112" height="112" aria-hidden="true">
        <path class="splash__bubble" d="M256 112c-84 0-152 60-152 134 0 40 20 76 52 100l-12 54 58-30c17 6 35 9 54 9 84 0 152-60 152-133S340 112 256 112z" />
        <path class="splash__bolt" d="M282 166l-74 96h46l-24 82 76-104h-48z" />
      </svg>
      <div class="splash__bar" aria-hidden="true"></div>
      <p class="splash__text">Carregando…</p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
